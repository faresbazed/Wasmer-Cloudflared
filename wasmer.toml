[package]
name = "your-username/my-wasmer-app"
version = "0.1.0"
description = "Web server deployed directly on Wasmer Edge"

[dependencies]
"wasmer/winterjs" = "1.3.0"

[fs]
"/src" = "."

[[command]]
name = "script"
module = "wasmer/winterjs:winterjs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/src/index.js"]
env = ["PORT=8080"]
