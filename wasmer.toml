[package]
name = "your-username/vless-wasmer-node"
version = "0.1.0"
description = "Pure JS VLESS over WebSocket for Wasmer Edge"

[dependencies]
"wasmer/node" = "20.11.0"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "wasmer/node:node"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["/app/index.js"]
env = [
  "PORT=8080",
  "UUID=d342d11e-d424-4583-b36e-524ab1f0afa4",
  "WSPATH=/vless"
]
